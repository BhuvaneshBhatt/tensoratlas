name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,plot,docs]"
      - name: Release audit
        run: python tools/release_audit.py
      - name: Smoke public examples
        run: python tools/smoke_examples.py
      - name: Lint
        run: python -m ruff check src tests examples benchmarks tools
      - name: Test
        run: python -m pytest
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
