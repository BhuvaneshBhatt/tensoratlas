[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensoratlas"
version = "0.1.0"
description = "SymPy-backed symbolic tensor algebra, coordinate geometry, forms, relativity, and geometric algebra."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
license-files = ["LICENSE"]
authors = [{name = "Bhuvanesh Bhatt (bhuvaneshbhatt@gmail.com)"}]
keywords = ["sympy", "tensor algebra", "differential geometry", "relativity", "geometric algebra"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "build>=1", "twine>=5"]
plot = ["matplotlib>=3.8", "numpy>=1.26"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9"]


[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
tensoratlas = ["coordinate_catalog.json", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
